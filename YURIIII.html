<!DOCTYPE html>
<html lang="en">

<!-- yuri viewer lol
     scroll to zoom, drag to pan, new yuri every refresh -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- stop the cdn from blocking the images --> 
  <meta name="referrer" content="no-referrer"> 
  <title>YURIIIIII:33333333333</title> 
  <style>
    /* reset all the default browser stuff */
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important;  user-select: none;}
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* :3 cursor */
    #cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 14px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 4px black, 0 0 4px black;
      user-select: none;
      transform: translate(-2px, -10px);
    }

    /* :3 everywhere behind the image */
    #dots {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.12);
      word-break: break-all;
      line-height: 1.7;
      pointer-events: none; /* so you can still click the image */
      user-select: none;
      z-index: 0;
    }

    /* the actual yuri */
    img#bg {
      position: fixed;
      top: 50%;
      left: 50%;
      width: auto;
      height: 100%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      cursor: grab;
      z-index: 1;
    }

    /* show grabbing cursor while dragging */
    img#bg.dragging { cursor: grabbing; }

    /* shrine mode — infinitely scrolling :3 wall, shown via JS when hash is #shrine:3 */
    #shrine { display: none; }
    #shrine-inner {
      font-size: 22px;
      font-weight: bold;
      color: white;
      line-height: 1.6;
      word-break: break-all;
      white-space: normal;
      animation: scrollup 30s linear infinite;
      padding: 10px;
    }
    @keyframes scrollup {
      from { transform: translateY(0); }
      to   { transform: translateY(-50%); }
    }
  </style>
</head>

    // :3 cursor follows the mouse
    const cursor = document.getElementById('cursor');
    window.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    // fill the whole screen with :3
    document.getElementById('dots').textContent = ':3 '.repeat(50000);

    // shrine mode — use #shrine:3 (works on Vercel) or ?shrine (works locally with file://)
    if (location.search.includes('shrine') || location.hash.includes('shrine')) {
      const shrine = document.getElementById('shrine');
      shrine.style.cssText = 'display:block;position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;z-index:9998;background:#000;';
      // double the text so the scroll loop is seamless
      const text = ':3 '.repeat(10000);
      document.getElementById('shrine-inner').textContent = text + text;
    }

    // grab a random yuri
    const img = document.getElementById('bg');
    const url = urls[Math.floor(Math.random() * urls.length)];
    img.src = url;

    // zoom and pan state — target is where we want, cur is the smoothed value each frame
    let targetScale = 1, curScale = 1;
    let targetTx = 0,    curTx = 0;
    let targetTy = 0,    curTy = 0;

    // for dragging around
    let dragging = false, startX, startY, startTx, startTy;

    // runs every frame and smoothly lerps toward the target position and scale
    function lerp(a, b, t) { return a + (b - a) * t; }

    function animate() {
      curScale = lerp(curScale, targetScale, 0.1);
      curTx    = lerp(curTx,    targetTx,    0.1);
      curTy    = lerp(curTy,    targetTy,    0.1);
      img.style.transform = `translate(calc(-50% + ${curTx}px), calc(-50% + ${curTy}px)) scale(${curScale})`;
      requestAnimationFrame(animate);
    }
    animate();

    // scroll to zoom in/out (0.5x min, 10x max)
    window.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      targetScale = Math.min(Math.max(targetScale * delta, 0.5), 10);
    }, { passive: false });

    // drag to move around
    img.addEventListener('mousedown', e => {
      e.preventDefault(); // stop the weird browser drag ghost thing
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startTx = targetTx; startTy = targetTy;
      img.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      targetTx = startTx + (e.clientX - startX);
      targetTy = startTy + (e.clientY - startY);
    });

    window.addEventListener('mouseup', () => {
      dragging = false;
      img.classList.remove('dragging');
    });

  </script>
